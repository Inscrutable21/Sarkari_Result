<!-- Component: Pre-Footer Call to Action Banner -->
<section class="pre-footer-banner-section">
  <div class="banner-warm-card">
    <div class="banner-text-col">
      <h2 class="banner-headline">Let's Find Your Next Opportunity</h2>
      <p class="banner-desc">Stay updated with the latest government jobs, results, admit cards and syllabus.</p>
    </div>
    <div class="banner-action-col">
      <button type="button" class="btn-get-updates" onclick="document.getElementById('btn-open-alerts')?.click();" style="padding: 0.85rem 2rem; font-size: 1rem;">
        <span>Get Free Updates &rarr;</span>
      </button>
      <div class="banner-doodle-quote">
        <svg width="40" height="25" viewBox="0 0 40 25" fill="none" style="display: block; margin-bottom: 4px; margin-left: auto;">
          <path d="M2 12 L38 2 L22 22 L18 13 Z" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span>A BRIGHTER<br>TOMORROW<br>BEGINS HERE</span>
      </div>
    </div>
  </div>
</section>
