<!-- Component: Trending Highlights Section -->
<section id="trending-section" class="trending-section" aria-labelledby="trending-title">
  <div class="section-heading-row">
    <div class="heading-title-group">
      <h2 id="trending-title" class="trending-title-main">
        <span>Trending Highlights</span>
      </h2>
      <span class="trending-subtitle">Latest and most important notifications for you</span>
    </div>
    <button type="button" id="btn-view-all-trending" class="view-all-trending-btn">
      <span>View All</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>
  <div id="trending-container" class="trending-grid">
    <!-- Populated dynamically by components -->
  </div>
</section>
